services:
  squid:
    build: ./squid
    image: squid-sslbump:local
    container_name: squid-forward-proxy
    restart: unless-stopped
    ports:
      # Forward (web) proxy port, exposed on all interfaces so other machines can use it.
      # Host 7080 is taken by another container, so publish on 7090 (still 7080 inside).
      - "7090:7080"
    # NAT hairpin workaround. kapp.upthere.ai resolves to this site's PUBLIC IP
    # (63.135.181.192), but the service is actually hosted inside this LAN. The
    # router does not hairpin — connecting to our own public IP from inside gets
    # "connection refused" — so point Squid straight at the internal address.
    # joon.upthere.ai is already handled this way in DNS; this matches it.
    # The durable fix is a split-horizon DNS record; see README.
    extra_hosts:
      - "kapp.upthere.ai:192.168.1.93"
    volumes:
      - ./squid/squid.conf:/etc/squid/squid.conf:ro
      - ./squid/nobump.acl:/etc/squid/nobump.acl:ro
      - ./squid/ssl:/etc/squid/ssl:ro
      - squid-cache:/var/cache/squid
      - squid-ssl-db:/var/lib/squid
    ulimits:
      # Plenty of file descriptors for many concurrent connections.
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      # Minimal image (no curl/wget); probe the port via bash... but alpine has no bash.
      # Use squidclient (shipped with the alpine squid package).
      test: ["CMD-SHELL", "squidclient -h 127.0.0.1 -p 7080 mgr:info >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  squid-cache:
  squid-ssl-db:
