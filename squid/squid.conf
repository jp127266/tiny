# ---------------------------------------------------------------------------
# Squid forward (caching) proxy with SSL-bump
#   - Listens on 7080, reachable from other machines
#   - 4GB on-disk cache
#   - Decrypts HTTPS (SSL-bump) so HTTPS responses are cacheable
#
# SSL-bump is a deliberate man-in-the-middle: every client must trust the CA in
# ./ssl/ca.crt, and whoever holds ca.key can read the decrypted traffic.
# ---------------------------------------------------------------------------

# Proxy port with TLS interception enabled. The tls-cert/tls-key is the local CA
# Squid uses to sign per-site certificates it generates on the fly.
http_port 7080 ssl-bump \
    generate-host-certificates=on \
    dynamic_cert_mem_cache_size=8MB \
    tls-cert=/etc/squid/ssl/ca.crt \
    tls-key=/etc/squid/ssl/ca.key \
    cipher=HIGH:MEDIUM:!RC4:!aNULL:!MD5

# Helper that generates and caches the per-site certificates.
sslcrtd_program /usr/lib/squid/security_file_certgen -s /var/lib/squid/ssl_db -M 4MB
sslcrtd_children 5

# --- SSL-bump policy ---------------------------------------------------------
# peek at step 1 (read SNI/ClientHello), then bump (decrypt) everything.
# Sites listed in nobump.acl are spliced (passed through without decryption) —
# use it for cert-pinned hosts that break when bumped.
acl nobump ssl::server_name "/etc/squid/nobump.acl"
acl step1 at_step SslBump1

ssl_bump peek step1
ssl_bump splice nobump
ssl_bump bump all

# --- Proxy signature hardening -----------------------------------------------
# By default Squid stamps bumped requests with "Via: 1.1 host (squid/x)" and
# "X-Forwarded-For: <client ip>", announcing the proxy and leaking the internal
# client IP to every site. Suppress both. (Spliced sites are untouched either
# way.) Note: this does NOT hide the OpenSSL TLS fingerprint on bumped HTTPS —
# splice a site via nobump.acl if it fingerprints TLS (anti-bot).
via off
forwarded_for delete

# --- Who is allowed to use the proxy -----------------------------------------
# Private LAN ranges — extend to match your network, or use "http_access allow all"
# (open proxy — only if this host is not reachable from the public internet).
acl localnet src 10.0.0.0/8
acl localnet src 172.16.0.0/12
acl localnet src 192.168.0.0/16
acl localnet src fc00::/7
acl localnet src fe80::/10

acl SSL_ports port 443
acl Safe_ports port 80          # http
acl Safe_ports port 443         # https
acl Safe_ports port 21          # ftp
acl Safe_ports port 1025-65535  # unregistered ports
acl CONNECT method CONNECT

http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports
http_access allow localhost manager
http_access deny manager
http_access allow localnet
http_access allow localhost
http_access deny all

# --- Caching -----------------------------------------------------------------
# Higher-hit-ratio eviction than the default LRU. Must precede cache_dir so it
# applies to the store below: LFUDA maximizes byte hit-ratio on disk, GDSF
# favors small popular objects in memory.
cache_replacement_policy heap LFUDA
memory_replacement_policy heap GDSF

# aufs = threaded async disk I/O — avoids the blocking stalls of ufs, which
# matters a lot on this rotational disk. Still a hard 4096 MB = 4GB disk cap.
cache_dir aufs /var/cache/squid 4096 16 256

# Large in-memory hot-object cache: RAM hits bypass the slow disk entirely.
# This is separate from the 4GB disk cap above.
cache_mem 8192 MB
maximum_object_size 512 MB
maximum_object_size_in_memory 16 MB

# Collapse concurrent requests for the same uncached object into a single fetch.
collapsed_forwarding on

refresh_pattern ^ftp:           1440    20%     10080
refresh_pattern -i (/cgi-bin/|\?) 0     0%      0
refresh_pattern .               0       20%     4320

coredump_dir /var/cache/squid

# Batch access-log writes instead of one syscall per request (helps on HDD).
buffered_logs on
