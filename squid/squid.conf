# ---------------------------------------------------------------------------
# Squid forward (caching) proxy with SSL-bump
#   - Listens on 7080, reachable from other machines
#   - 4GB on-disk cache
#   - Decrypts HTTPS (SSL-bump) so HTTPS responses are cacheable
#
# SSL-bump is a deliberate man-in-the-middle: every client must trust the CA in
# ./ssl/ca.crt, and whoever holds ca.key can read the decrypted traffic.
# ---------------------------------------------------------------------------

# Proxy port with TLS interception enabled. The tls-cert/tls-key is the local CA
# Squid uses to sign per-site certificates it generates on the fly.
# dynamic_cert_mem_cache_size holds already-minted per-site certs in RAM. Every
# miss here costs an RSA signing round-trip on the first TLS handshake to that
# host, so a roomy cache directly cuts first-visit latency. 64MB is still tiny.
http_port 7080 ssl-bump \
    generate-host-certificates=on \
    dynamic_cert_mem_cache_size=64MB \
    tls-cert=/etc/squid/ssl/ca.crt \
    tls-key=/etc/squid/ssl/ca.key \
    cipher=HIGH:MEDIUM:!RC4:!aNULL:!MD5

# Helper that generates and caches the per-site certificates.
# Cert signing is CPU-bound and blocking: with only 5 helpers, opening many new
# HTTPS hosts at once (a fresh page with assets on several domains) queues and
# stalls handshakes. This host has 16 cores sitting idle — spend them here.
sslcrtd_program /usr/lib/squid/security_file_certgen -s /var/lib/squid/ssl_db -M 16MB
sslcrtd_children 32 startup=8 idle=4

# --- SSL-bump policy ---------------------------------------------------------
# peek at step 1 (read SNI/ClientHello), then bump (decrypt) everything.
# Sites listed in nobump.acl are spliced (passed through without decryption) —
# use it for cert-pinned hosts that break when bumped.
acl nobump ssl::server_name "/etc/squid/nobump.acl"
acl step1 at_step SslBump1

ssl_bump peek step1
ssl_bump splice nobump
ssl_bump bump all

# --- Proxy signature hardening -----------------------------------------------
# By default Squid stamps bumped requests with "Via: 1.1 host (squid/x)" and
# "X-Forwarded-For: <client ip>", announcing the proxy and leaking the internal
# client IP to every site. Suppress both. (Spliced sites are untouched either
# way.) Note: this does NOT hide the OpenSSL TLS fingerprint on bumped HTTPS —
# splice a site via nobump.acl if it fingerprints TLS (anti-bot).
via off
forwarded_for delete

# --- DNS ---------------------------------------------------------------------
# This container has no working IPv6 egress. `dns_v4_first on` used to be the
# fix, but it is OBSOLETE in Squid 6 (accepted, then ignored) — do not re-add it.
#
# An earlier note here claimed this cost little, on the theory that a v6 connect
# fails instantly with ENETUNREACH and Squid then falls through to IPv4. The
# first half is true (the failures take 0 ms); the fall-through is NOT. On a
# spliced CONNECT tunnel Squid gives up on that one address and returns 503 —
# and since a spliced tunnel has no way to deliver an HTML error page, the
# browser just sees the socket close mid-handshake (PR_END_OF_FILE_ERROR).
# Measured on this host: 333 of 333 requests that chose a v6 origin address
# failed, all of them google.com/youtube.com, i.e. entries in nobump.acl.
# It also presents as INTERMITTENT — Squid marks the address bad after the first
# failure, so a reload succeeds, until positive_dns_ttl expires and re-resolves
# the v6 address fresh.
#
# The fix lives in docker-compose.yml (net.ipv6.conf.all.disable_ipv6=1), not
# here: with the loopback ::1 gone, Squid's startup IPv6 probe fails and it stops
# querying AAAA entirely. Confirm with `docker exec squid-forward-proxy grep
# 'IPv6 socket' /var/log/squid/cache.log` — that line should no longer appear.
#
# Two startup messages are EXPECTED consequences of that switch, not defects:
#   "WARNING: BCP 177 violation. Detected non-functional IPv6 loopback."
#   "aclIpParseIpData: IPv6 has not been enabled."  (x3, from Squid's BUILT-IN
#    localhost/to_localhost/to_linklocal ACLs — not from anything in this file)
#
# Cache DNS answers longer. Browsing hits the same handful of hosts repeatedly,
# and the default positive TTL re-queries far more than necessary.
positive_dns_ttl 6 hours
negative_dns_ttl 30 seconds

# --- Connection handling -----------------------------------------------------
# Keep upstream and client connections alive so repeat requests skip the TCP +
# TLS handshake entirely. This is the single biggest per-request saving on a
# proxy that must re-originate TLS for every bumped host.
client_persistent_connections on
server_persistent_connections on
half_closed_clients off

# Read further ahead on the origin socket than the 16KB default, so large
# objects stream without stop-start stalls.
read_ahead_gap 64 KB

# Tell Squid it really may use the 65536 FDs the compose ulimit grants it.
max_filedescriptors 65536

# --- Who is allowed to use the proxy -----------------------------------------
# Private LAN ranges — extend to match your network, or use "http_access allow all"
# (open proxy — only if this host is not reachable from the public internet).
acl localnet src 10.0.0.0/8
acl localnet src 172.16.0.0/12
acl localnet src 192.168.0.0/16
# The IPv6 ranges (fc00::/7, fe80::/10) that used to be here have been removed.
# IPv6 is switched off for this container (see the DNS section above), so Squid
# rejected them at parse time with "aclIpParseIpData: IPv6 has not been enabled"
# on every start — dead rules generating noise. Restore them alongside re-enabling
# IPv6 in docker-compose.yml, never on their own.

acl SSL_ports port 443
acl Safe_ports port 80          # http
acl Safe_ports port 443         # https
acl Safe_ports port 21          # ftp
acl Safe_ports port 1025-65535  # unregistered ports
acl CONNECT method CONNECT

http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports
http_access allow localhost manager
http_access deny manager
http_access allow localnet
http_access allow localhost
http_access deny all

# --- Caching -----------------------------------------------------------------
# DO NOT CACHE Azure Blob Storage. Its 304 responses carry "Content-Length: 0"
# (service version x-ms-version: 2009-09-19). When Squid revalidates a stored
# object and merges that 304's headers into the cached entry, the real length is
# overwritten with 0. Squid then still puts the full body on the wire, but the
# response it sends declares Content-Length: 0 — so every client honouring the
# header reads an EMPTY body from a 200 OK. Silent corruption, not an error.
#
# Observed: optanon.blob.core.windows.net serves the OneTrust consent stylesheet
# for thenude.com. Once poisoned, the site's cookie "Privacy Preference Center"
# rendered as unstyled raw DOM — no overlay, no layout — because its only
# stylesheet arrived empty.
#
# Two properties make this nasty:
#   - A hard refresh does NOT clear it. `reload-into-ims` below turns the reload
#     into an If-Modified-Since, the origin answers 304, and the same poisoned
#     headers are re-served (logged TCP_REFRESH_UNMODIFIED).
#   - A restart does NOT clear it either. The disk entry survives, and the first
#     access after startup revalidates it — re-poisoning it within one request.
# Only a changed URL escaped it, because that is a fresh MISS.
#
# There is no directive to make Squid ignore Content-Length in a 304, so the fix
# is to keep these objects out of the store entirely: every request becomes a
# MISS and the origin's real headers pass through untouched. Little is lost —
# this is small, rarely-changing third-party JS/CSS. Narrow to the single host
# `optanon.blob.core.windows.net` if you want caching back for other blobs.
acl azure_blob dstdomain .blob.core.windows.net
cache deny azure_blob

# Higher-hit-ratio eviction than the default LRU. Must precede cache_dir so it
# applies to the store below: LFUDA maximizes byte hit-ratio on disk, GDSF
# favors small popular objects in memory.
cache_replacement_policy heap LFUDA
memory_replacement_policy heap GDSF

# aufs = threaded async disk I/O, avoiding the blocking stalls of ufs.
# NOTE: the backing store here is an SSD (/dev/sda rotational=0), not a spinning
# disk as an earlier comment claimed — seek cost is not the concern it would be
# on an HDD. Still a hard 4096 MB = 4GB disk cap.
cache_dir aufs /var/cache/squid 4096 16 256

# In-memory hot-object cache: RAM hits skip disk entirely.
# SIZED FOR THIS HOST: 15GB total RAM, shared with other containers. Squid grows
# into this limit and never gives it back, so 8GB risked pushing the box into
# swap — which would cost far more latency than the memory cache ever saves.
# 4GB still comfortably holds the hot set (mean object size is ~20KB).
cache_mem 4096 MB
maximum_object_size 512 MB
maximum_object_size_in_memory 16 MB

# Start evicting before the store is completely full, so a full cache degrades
# smoothly instead of thrashing at the high-water mark.
cache_swap_low 90
cache_swap_high 95

# Collapse concurrent requests for the same uncached object into a single fetch.
collapsed_forwarding on

# When a client aborts a transfer, finish fetching it anyway so the object still
# lands in cache for the next request, instead of wasting the partial download.
quick_abort_min 16 KB
quick_abort_max 16 KB
quick_abort_pct 95

# Evaluated top-down, FIRST MATCH WINS — the catch-all must stay last.
#
# Squid 6 has no `override-expires`, so none of these can overrule an explicit
# Cache-Control/Expires from the origin (which is correct — we honour what the
# server asks). What they DO control is the heuristic freshness applied when a
# response carries no explicit expiry, plus how client reloads are handled.
#
# `reload-into-ims` is the notable win for perceived speed: a browser reload
# becomes a conditional If-Modified-Since instead of a full re-download, so an
# unchanged asset costs a small 304 rather than the whole object.
refresh_pattern ^ftp:           1440    20%     10080

# Immutable-by-convention assets: fonts and archives essentially never change
# in place under a given URL.
refresh_pattern -i \.(woff2?|ttf|otf|eot)$      43200 95% 129600 reload-into-ims store-stale
refresh_pattern -i \.(zip|gz|xz|bz2|7z|rar|iso|deb|rpm|apk|exe|msi|pkg|dmg)$ 43200 95% 129600 store-stale

# Static page assets. Versioned/content-hashed in practice, so a long heuristic
# freshness window is safe when the origin gave us no explicit expiry.
refresh_pattern -i \.(jpg|jpeg|png|gif|webp|avif|ico|svg|bmp)$ 10080 90% 43200 reload-into-ims store-stale
refresh_pattern -i \.(css|js|mjs)$              10080 90% 43200 reload-into-ims store-stale
refresh_pattern -i \.(mp4|webm|mp3|ogg|wav|flac)$ 10080 90% 43200 store-stale

# NOTE: the legacy `(/cgi-bin/|\?) 0 0% 0` rule that used to sit here has been
# removed. It dated from when a query string implied a dynamic CGI script; today
# most versioned static assets look like `app.js?v=abc123`, and that rule forced
# every one of them to be refetched. Squid still fully honours no-cache/no-store/
# private from the origin, so genuinely dynamic responses are still not cached.
refresh_pattern -i /cgi-bin/    0       0%      0
refresh_pattern .               0       20%     4320

coredump_dir /var/cache/squid

# Batch access-log writes instead of one syscall per request (helps on HDD).
buffered_logs on
